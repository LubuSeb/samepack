name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and CLI tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Prove the empty dependency graph
        shell: bash
        run: |
          go list -m all | tee module-list.txt
          test "$(wc -l < module-list.txt)" -eq 1
      - name: Build and pack twice
        shell: bash
        run: |
          mkdir -p proof
          go build -trimpath -o proof/samepack-a ./cmd/samepack
          go build -trimpath -o proof/samepack-b ./cmd/samepack
          cmp proof/samepack-a proof/samepack-b
          go run ./cmd/samepack pack --output "proof/${{ runner.os }}-a.tar.gz" ./demo/release-v1
          touch -t 203801190314 ./demo/release-v1/README.txt
          go run ./cmd/samepack pack --output "proof/${{ runner.os }}-b.tar.gz" ./demo/release-v1
          cmp "proof/${{ runner.os }}-a.tar.gz" "proof/${{ runner.os }}-b.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: proof-${{ runner.os }}
          path: proof/${{ runner.os }}-a.tar.gz
          if-no-files-found: error

  adversarial-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Race detector
        run: go test -race ./...
      - name: Fuzz smoke - archive parsing
        timeout-minutes: 2
        run: go test ./internal/archiveio -run=^$ -fuzz=^FuzzInspectNeverPanics$ -fuzztime=10s -parallel=2
      - name: Fuzz smoke - strict manifest decoding
        timeout-minutes: 2
        run: go test ./internal/archiveio -run=^$ -fuzz=^FuzzDecodeManifestStrict$ -fuzztime=10s -parallel=2
      - name: Fuzz smoke - cross-format record and verify
        timeout-minutes: 2
        run: go test ./internal/archiveio -run=^$ -fuzz=^FuzzRecordVerifyCrossFormat$ -fuzztime=10s -parallel=2
      - name: Fuzz smoke - exact mutation diagnosis
        timeout-minutes: 2
        run: go test ./internal/archiveio -run=^$ -fuzz=^FuzzVerifyPinpointsMutation$ -fuzztime=10s -parallel=2
      - name: Record once and verify another archive format
        shell: bash
        run: |
          mkdir -p proof
          go run ./cmd/samepack pack --output proof/release.zip ./demo/release-v1
          go run ./cmd/samepack pack --output proof/release.tar.gz ./demo/release-v1
          go run ./cmd/samepack record --output proof/release.samepack.json proof/release.zip
          go run ./cmd/samepack verify proof/release.samepack.json proof/release.tar.gz

  cross-os-proof:
    needs: test-and-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proof-Windows
          path: proof/windows
      - uses: actions/download-artifact@v8
        with:
          name: proof-Linux
          path: proof/linux
      - name: Prove Windows and Linux archives are byte-identical
        run: |
          sha256sum proof/windows/Windows-a.tar.gz proof/linux/Linux-a.tar.gz
          cmp proof/windows/Windows-a.tar.gz proof/linux/Linux-a.tar.gz
